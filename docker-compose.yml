services:
  web:
    build: .
    image: curtain-pattern-cut:latest
    container_name: curtain-pattern-cut
    ports:
      - "8000:8000"
    volumes:
      # 命名卷保留 /data 下的 SQLite 文件；容器重建、镜像升级都不丢已裁记录。
      - curtain_data:/data
    environment:
      DATABASE_PATH: /data/curtain.db
      SECRET_KEY: change-me-in-production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  curtain_data:
